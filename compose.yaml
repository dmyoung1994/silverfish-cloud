services:
  relay:
    build:
      context: .
      dockerfile: services/relay/Dockerfile
    environment:
      CO_DEX_RELAY_ADDR: 0.0.0.0:8787
      CO_DEX_WEB_DIR: /app/web
      RUST_LOG: co_dex_relay=info,tower_http=info
    ports:
      - "8787:8787"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

