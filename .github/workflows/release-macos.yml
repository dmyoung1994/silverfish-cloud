name: Release macOS build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      - name: Write the App Store Connect API key to disk
        run: |
          set -euo pipefail
          echo "${APPLE_API_KEY_CONTENT}" | base64 --decode > "${RUNNER_TEMP}/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/apple_api_key.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - name: Build, sign, and notarize
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          VITE_SILVERFISH_MANAGED_SERVICE: "true"
          VITE_SILVERFISH_RELAY_URL: ${{ vars.VITE_SILVERFISH_RELAY_URL }}
          VITE_SILVERFISH_SUBSCRIBE_URL: ${{ vars.VITE_SILVERFISH_SUBSCRIBE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          args: --target aarch64-apple-darwin

      - name: Publish the signed .dmg to the site's download folder
        run: |
          set -euo pipefail
          dmg=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n1)
          mkdir -p apps/desktop/public/downloads
          cp "$dmg" apps/desktop/public/downloads/Silverfish-macOS-arm64.dmg

      - run: npm run build

      - name: Deploy the site and relay proxy worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
