name: Release macOS build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      - name: Write the App Store Connect API key to disk
        run: |
          set -euo pipefail
          echo "${APPLE_API_KEY_CONTENT}" | base64 --decode > "${RUNNER_TEMP}/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/apple_api_key.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - name: Build and sign
        run: npm --workspace apps/desktop run tauri -- build --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SILVERFISH_MANAGED_SERVICE: "true"
          VITE_SILVERFISH_RELAY_URL: ${{ vars.VITE_SILVERFISH_RELAY_URL }}
          VITE_SILVERFISH_SUBSCRIBE_URL: ${{ vars.VITE_SILVERFISH_SUBSCRIBE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_SECRET }}
      - name: Preserve the signed DMG before notarization
        uses: actions/upload-artifact@v4
        with:
          name: Silverfish-macOS-arm64-signed
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Notarize, staple, and verify
        run: |
          set -euo pipefail
          dmg=$(find target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n1)
          codesign --verify --deep --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 45m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      - name: Publish the signed .dmg to the site's download folder
        run: |
          set -euo pipefail
          dmg=$(find target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n1)
          updater_bundle=$(find target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz" | head -n1)
          test -n "$updater_bundle" && test -f "$updater_bundle.sig"
          mkdir -p apps/desktop/public/downloads apps/desktop/public/updates
          cp "$dmg" apps/desktop/public/downloads/Silverfish-macOS-arm64.dmg
          release_version=$(node -p 'require("./apps/desktop/package.json").version')
          node scripts/publish-updater-release.mjs \
            --version "$release_version" \
            --artifact "$updater_bundle" \
            --signature "$updater_bundle.sig" \
            --base-url "https://try.silverfish-app.workers.dev" \
            --notes "Guest-to-host conversion funnel and automatic in-app updates." \
            --output-dir apps/desktop/public/updates

      - run: npm run build

      - name: Apply D1 migrations and deploy the site and relay proxy worker
        run: |
          npx wrangler d1 migrations apply silverfish-entitlements --remote --config workers/relay-proxy/wrangler.jsonc
          npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
